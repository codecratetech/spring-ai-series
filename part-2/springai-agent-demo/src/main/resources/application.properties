spring.application.name=spring-ai-agent-demo
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=qwen/qwen3.8-27b

# H2 database
spring.datasource.url=jdbc:h2:file:./data/agentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LLM request/response logging (SimpleLoggerAdvisor)
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
spring.application.name=spring-ai-mcp-client-demo
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=qwen/qwen3.8-27b

#mcp client configuration
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.task-server.url=http://localhost:8081


# LLM request/response logging (SimpleLoggerAdvisor)
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
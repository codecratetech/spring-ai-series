spring.application.name = task-manager-mcp-server
server.port = 8081

spring.ai.mcp.server.name = task-manager
spring.ai.mcp.server.version = 1.0.0
spring.ai.mcp.server.type = SYNC
spring.ai.mcp.server.protocol = STREAMABLE
spring.ai.mcp.server.instructions = Task Manager server. Use the tools to create, list, search and complete tasks.

# H2 database
spring.datasource.url=jdbc:h2:file:./data/agentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console